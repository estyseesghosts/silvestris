[workspace]
resolver = "2"
members = [
    "crates/silvestris-core",
    "crates/silvestris-fonts",
    "crates/silvestris",
    "crates/silvestris-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
authors = ["terezi <jules@foxtails.me>"]
repository = "https://github.com/estyseesghosts/silvestris"

[workspace.dependencies]
silvestris-core = { path = "crates/silvestris-core", version = "0.1.0" }
silvestris-fonts = { path = "crates/silvestris-fonts", version = "0.1.0" }
silvestris = { path = "crates/silvestris", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Versions already locked through GPUI (Cargo.lock); listed so Silvestris can
# build RenderImage frames and report errors with GPUI's own types.
anyhow = "1"
image = { version = "0.25", default-features = false }
smallvec = { version = "1.6", features = ["union", "const_new"] }
log = "0.4"
raw-window-handle = "=0.6.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

# GPUI is pinned to the exact Zed commit Lotus builds against
# (lotus config/pins.toml [gpui]). Moving it is a deliberate change: update
# config/pins.toml and Cargo.lock here and in Lotus in the same change.
gpui = { git = "https://github.com/zed-industries/zed", rev = "6b720973027999bae402df23d469026f4cced988", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "6b720973027999bae402df23d469026f4cced988", default-features = false }

# Same reasoning as Lotus #117: full debuginfo for the GPUI tree is enormous.
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
