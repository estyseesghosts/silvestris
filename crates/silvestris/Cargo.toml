[package]
name = "silvestris"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

description = "Snow Leopard (Mac OS X 10.6) Aqua and Geist application shell and controls for GPUI."

[features]
test-support = ["gpui/test-support"]
std-fs = []

[dependencies]
silvestris-core = { workspace = true }
silvestris-fonts = { workspace = true }
gpui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
image = { workspace = true }
smallvec = { workspace = true }
log = { workspace = true }
unicode-segmentation = "1.13"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# DWM corner preference for the custom-chrome window (handbook 06).
raw-window-handle = { workspace = true }
windows = { workspace = true }

[target.'cfg(unix)'.dependencies]
# getuid for the freedesktop/macOS trash directory name.
libc = "0.2"
